name: Build Electron App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install ddddocr

      - name: Install Node deps
        run: npm ci

      - name: Set package version
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          npm version $version --no-git-tag-version
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package source backup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path source-backup | Out-Null
          $zipName = "bzxz-source-$env:APP_VERSION.zip"
          $zipPath = "source-backup/$zipName"
          $exclude = @(
            'node_modules',
            'dist',
            'release',
            'source-backup',
            'dist-portable',
            'dist-nsis',
            '.git'
          )
          $items = Get-ChildItem -Force | Where-Object { $exclude -notcontains $_.Name }
          Compress-Archive -Path $items.FullName -DestinationPath $zipPath -CompressionLevel Optimal
          "SOURCE_ZIP=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Created $zipPath"

      - name: Upload source backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: bzxz-${{ env.APP_VERSION }}-source
          path: source-backup/

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Package Electron (portable + nsis)
        run: npm run electron:build:all

      - name: Split artifacts
        run: |
          New-Item -ItemType Directory -Force -Path dist-portable, dist-nsis
          Get-ChildItem -Path release -Filter "*.exe" | Where-Object { $_.Name -match "Setup" } | Copy-Item -Destination dist-nsis
          Get-ChildItem -Path release -Filter "*.exe" | Where-Object { $_.Name -notmatch "Setup" } | Copy-Item -Destination dist-portable

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: bzxz-${{ env.APP_VERSION }}-portable-win
          path: dist-portable/

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: bzxz-${{ env.APP_VERSION }}-nsis-win
          path: dist-nsis/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: bzxz ${{ env.APP_VERSION }}
          make_latest: true
          files: |
            release/*.exe
            source-backup/*.zip
